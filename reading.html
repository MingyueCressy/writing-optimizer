<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作文批阅工作台</title>
<style>
  :root{
    --paper:#f6f0e2; --paper-line:#e3d9c4; --ink:#2b2721; --ink-soft:#6b6459;
    --tool-bg:#262b33; --tool-bg2:#1c2027; --tool-line:#3a424e; --accent:#c9992e;
    --font-serif: Georgia, "Times New Roman", "Songti SC", serif;
    --font-note: "Source Han Sans SC","思源黑体","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);font-family:var(--font-note);color:var(--ink)}
  #app{display:flex;height:100vh;height:100dvh;overflow:hidden}

  #stage{flex:1;display:flex;flex-direction:column;padding:0;overflow:auto;position:relative}
  #viewToggle{position:fixed;bottom:18px;left:50%;transform:translateX(calc(-50% + var(--vt-shift,0px)));z-index:60;
    display:flex;align-items:center;gap:6px;background:rgba(28,32,39,.92);
    border:1px solid #3a424e;border-radius:20px;padding:6px 12px 6px 10px;
    color:#e7d9b4;font-size:12px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);
    transition:.15s;user-select:none}
  #viewToggle:hover{background:#3c4653;transform:translateX(calc(-50% + var(--vt-shift,0px))) translateY(-1px)}
  #viewToggle .vic{font-size:15px;line-height:1}

  #paperWrap{display:flex;flex-direction:column;align-items:stretch;width:100%;flex:1;min-height:100%}
  #paper{
    position:relative;width:100%;max-width:100%;
    background:linear-gradient(180deg,#f8f3e7 0%,var(--paper) 100%);
    border-radius:0;box-shadow:none;
    padding:46px 40px 48px;overflow:visible;flex:1;
  }
  #paper::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:0;
    background-image:radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
    background-size:3px 3px;mix-blend-mode:multiply;opacity:.5}
  #paperHead{position:relative;z-index:2;border-bottom:1.5px solid var(--paper-line);padding-bottom:12px;margin-bottom:18px}
  #headRow1{display:flex;align-items:center;gap:14px}
  #headA{flex:1 1 auto;min-width:0;text-align:center}
  #pTitle{font-family:var(--font-serif);font-size:19px;font-weight:700;color:#241f18;line-height:1.3;white-space:nowrap}
  #pTitle2{font-family:var(--font-serif);font-size:19px;font-weight:700;color:#241f18;line-height:1.3;white-space:nowrap}
  #headB{flex:0 0 auto;width:112px;text-align:center}
  #pScore{cursor:default}
  #pScore.clickable{cursor:pointer}
  #pScore.clickable:hover b{text-decoration:underline}
  #pScore b{font-family:var(--font-serif);font-size:23px;color:var(--accent);display:block;line-height:1.05}
  #pScore span{font-size:10px;color:var(--ink-soft);display:block;margin-top:4px;line-height:1.35}
  #pScore .tap{display:none;font-size:9px;color:#a5641c;margin-top:3px}
  body.viewing #pScore .tap{display:block}
  #headRow2{margin-top:10px;padding-top:9px;border-top:1px dashed var(--paper-line)}
  #pSub{font-size:11.5px;color:var(--ink-soft);letter-spacing:.2px}

  #content{position:relative;z-index:2;font-family:var(--font-serif);font-size:17.5px;line-height:2.15;color:var(--ink)}
  #content p{margin:0 0 16px;position:relative}
  #content p.salutation{margin-bottom:12px}
  #content p.closing{margin:0 0 4px}
  .run{position:relative;cursor:pointer;border-radius:2px}
  body:not(.viewing):not(.draft) .run:hover{background:rgba(201,153,46,.16)}
  .pend-ov{position:absolute;pointer-events:none;background:rgba(201,153,46,.30);box-shadow:0 0 0 1.5px #c9992e;border-radius:3px;z-index:3}

  .mk-wave{text-decoration:underline wavy;text-decoration-thickness:1.7px;text-underline-offset:5px}
  .mk-underline{text-decoration:underline;text-decoration-thickness:1.7px;text-underline-offset:5px}
  .mk-double{text-decoration:underline double;text-decoration-thickness:3px;text-underline-offset:5px}
  .mk-strike{text-decoration:line-through;text-decoration-thickness:1.7px}

  .overlay{position:absolute;z-index:1;pointer-events:none}
  .mk-circle-svg path{fill:none;stroke-width:2.2;stroke-linecap:round}
  .mk-box-svg rect{fill:none;stroke-width:1.8;stroke-linejoin:round}
  .draft .run{background:none!important}
  .draft .overlay{display:none}
  .draft .mk-wave,.draft .mk-underline,.draft .mk-double,.draft .mk-strike{text-decoration:none!important}
  .draft .mk-highlight-span{background:none!important}

  .anno{position:absolute;z-index:40;max-width:260px;
    background:#fffdf6;border:1px solid #e0d6bd;border-left:4px solid #999;border-radius:6px;
    padding:8px 11px;font-size:12px;line-height:1.65;color:#332e26;
    box-shadow:0 8px 26px rgba(0,0,0,.28);pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s}
  .anno.show{opacity:1;transform:none}
  .anno .cite{font-family:var(--font-serif);font-style:italic;color:#a5641c;display:block;margin-bottom:3px;font-size:11.5px}

  #tools{flex:0 0 62px;background:linear-gradient(180deg,var(--tool-bg) 0%,var(--tool-bg2) 100%);
    border-left:1px solid #0c0f13;display:flex;flex-direction:column;align-items:center;
    padding:12px 8px;gap:7px;overflow-y:auto}
  .tool{width:44px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:#313845;border:1px solid var(--tool-line);border-radius:8px;padding:4px 2px;
    color:#cfd6e0;cursor:pointer;transition:.13s;user-select:none;position:relative}
  .tool:hover{background:#3c4653;transform:translateY(-1px)}
  .tool.active{background:var(--accent);border-color:#e8bd57;color:#1c1508;box-shadow:0 0 0 2px rgba(201,153,46,.35)}
  .tool .ic{font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .tool .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #ffffff66}
  .tsep{width:34px;height:1px;background:var(--tool-line);margin:4px 0}
  .tool.mini{height:36px}
  .tool.mini .ic{font-size:16px}

  #swatch{position:fixed;z-index:120;display:none;background:#2b323d;border:1px solid #4a5464;
    border-radius:10px;padding:9px 10px;box-shadow:0 10px 34px rgba(0,0,0,.6)}
  #swatch.show{display:block}
  #swatch .swTitle{color:#cfd6e0;font-size:10.5px;letter-spacing:.5px;margin-bottom:7px}
  #swatch .swRow{display:flex;gap:8px}
  .swatch-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #ffffff33;transition:.12s}
  .swatch-dot:hover{transform:scale(1.14);border-color:#fff}
  .swatch-dot.on{border-color:#fff;box-shadow:0 0 0 2px #fff8}

  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    background:rgba(28,32,39,.94);color:#e7d9b4;font-size:12px;padding:7px 14px;border-radius:20px;
    border:1px solid #3a424e;pointer-events:none;opacity:0;transition:opacity .2s;z-index:199}
  #hint.show{opacity:1}

  .modal{position:fixed;inset:0;background:rgba(8,10,13,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:#fbf7ec;border-radius:8px;width:min(560px,94vw);max-height:86vh;overflow:auto;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 4px;font-family:var(--font-serif);font-size:17px;color:#241f18}
  .modal .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:14px}
  .modal .mrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .mbtn{border:1px solid #d6cbaf;background:#f2ead6;border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;color:#3a342a;display:flex;align-items:center;gap:5px}
  .mbtn:hover{background:#eae0c8}
  .mbtn.on{background:var(--accent);border-color:#b8882a;color:#1c1508;font-weight:700}
  .modal label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 4px}
  .modal textarea{width:100%;min-height:74px;border:1px solid #ddd2b8;border-radius:5px;padding:8px;font-size:13px;line-height:1.6;resize:vertical;background:#fffdf7;color:#2b2721;font-family:var(--font-note)}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .modal button{border:1px solid #d6cbaf;background:#f2ead6;border-radius:5px;padding:8px 16px;font-size:12.5px;cursor:pointer}
  .modal button.primary{background:var(--accent);border-color:#b8882a;color:#1c1508;font-weight:600}
  .modal button.danger{background:#f6ded9;border-color:#d9a79c;color:#a5362a}
  .modal .quote{font-family:var(--font-serif);font-style:italic;background:#f3ecdb;border-radius:4px;padding:6px 9px;font-size:12.5px;color:#5a5142;margin-top:4px}
  .palette{display:flex;gap:7px;flex-wrap:wrap}
  .pdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid #00000022}
  .pdot.on{border-color:#8a6d1f;box-shadow:0 0 0 2px #c9992e88}
  .sumtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  .sumtable td{border:1px solid #e3d9c4;padding:6px 8px;vertical-align:top}
  .sumtable td:first-child{width:74px;color:var(--ink-soft);background:#f3ecdb;font-weight:600}
  .reclist{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
  .reclist li{padding:5px 0;border-bottom:1px dashed #e3d9c4}
  .reclist b{color:#c31f2b;font-family:var(--font-serif)}
  .reclist i{color:#2e7d46;font-style:normal}
  .dimlabel{font-size:11px;letter-spacing:1px;color:#a5641c;margin:14px 0 2px;font-weight:700}

  .pklist{display:flex;flex-direction:column;gap:7px;margin:8px 0 0}
  .pkitem{display:flex;align-items:center;gap:9px;border:1px solid #ddd2b8;background:#fffdf7;
    border-radius:7px;padding:9px 11px;cursor:pointer;transition:.13s}
  .pkitem:hover{background:#f6efdc;border-color:#c9992e}
  .pkitem.pknew{border-style:dashed;color:#8a6d1f}
  .pkitem .pksw{font-size:17px;width:20px;text-align:center;font-weight:700}
  .pkitem .pklb{flex:1;font-size:12.5px;color:#332e26}
  .pkitem .pklb i{display:block;font-family:var(--font-serif);color:#7d7364;font-size:11px;font-style:italic;margin-top:1px}
  .pkitem .pknote{font-size:10.5px;color:#a5641c;white-space:nowrap}

  @media (max-width:560px){
    #tools{flex-basis:56px;padding:10px 5px}
    .tool{width:40px;height:38px}
    #paper{padding:30px 22px 34px}
    #content{font-size:15px;line-height:2.0}
  }
  body.viewing #tools{display:none}
  body.viewing #viewToggle{color:#bfe3c4}
  body.locked #viewToggle{display:none}

  .mk-hl{border-radius:2px}
  /* 精读版：隐藏批注/总评/视角切换等批阅专属 UI */
  #editModal,#sumModal,#pickModal,#viewToggle,#swatch{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="paperWrap">
      <div id="paper">
        <div id="paperHead">
          <div id="headRow1">
            <div id="headA">
              <div id="pTitle">加载中…</div>
              <div id="pTitle2"></div>
            </div>
            <div id="headB">
              <div id="pScore"></div>
            </div>
          </div>
          <div id="headRow2">
            <div id="pSub"></div>
          </div>
        </div>
        <div id="content"></div>
      </div>
    </div>
    <div id="viewToggle" title="切换编辑 / 阅读视角">
      <span class="vic" id="vtIcon">✏️</span><span id="vtLabel">切到阅读</span>
    </div>
  </div>
  <div id="tools"></div>
</div>

<div id="hint"></div>
<div id="swatch"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<div class="modal" id="editModal">
  <div class="box">
    <h3 id="emTitle">编辑标记</h3>
    <div class="sub" id="emCite"></div>
    <div class="quote" id="emQuote"></div>
    <label>形态</label>
    <div class="mrow" id="emShapes"></div>
    <label>颜色</label>
    <div class="palette" id="emColors"></div>
    <label>批注意见</label>
    <textarea id="emText" placeholder="输入批注意见（可留空）…"></textarea>
    <div class="row">
      <button class="danger" id="emDelete">删除标记</button>
      <button id="emCancel">取消</button>
      <button class="primary" id="emOk">确定</button>
    </div>
  </div>
</div>

<div class="modal" id="sumModal">
  <div class="box" id="sumBox"></div>
</div>

<div class="modal" id="pickModal">
  <div class="box" style="width:min(420px,94vw)">
    <h3>这里有重叠的标记</h3>
    <div class="sub" id="pkCite"></div>
    <div class="pklist" id="pkList"></div>
    <div class="row"><button id="pkCancel">取消</button></div>
  </div>
</div>

<script type="application/json" id="app-data">{"meta":{"title":"2025 考研英语（一）","subtitle":"回复邮件　10 分　约 100 词　实际约 95 词","score":"7 / 10","scoreNote":"要点全覆盖、结构清晰；语言小错，无内容硬伤","source":"套用万能模板","pages":1,"title2":"小作文（Part A 应用文）"},"legend":[{"key":"error","label":"错词圈","color":"#d3232f","desc":"拼写 / 用词错误"},{"key":"grammar","label":"句法波浪","color":"#e08a00","desc":"语法 / 词性 / 搭配错"},{"key":"good","label":"亮点高亮","color":"#2e9e4f","desc":"写得好的表达"},{"key":"fatal","label":"硬伤标记","color":"#ff4d2e","desc":"内容矛盾等致命扣分"},{"key":"template","label":"模板句式","color":"#2f6fd0","desc":"可套用的空壳句式"},{"key":"note","label":"纯批注","color":"#7b5cc4","desc":"只挂意见，不改文字"}],"blocks":[{"type":"salutation","text":"Dear Paul,"},{"type":"para","id":"p1","text":"To enhance students' [[grammar:capabilities to craft-making|capability 后接 to do 或 of doing；craft-making 是动名词，应为 capabilities in craft-making。]] and enrich their extracurricular life, the craft-making activities will be held on the playground at 4 p.m. this Friday. I'm glad you are interested in the craft [[grammar:demonstrate|词性错：demonstrate 是动词，此处需名词 → the craft demonstration 或 the crafts on display。]] and willing to [[good:give a hand|地道，口语化恰当。]]."},{"type":"para","id":"p2","text":"The [[error:craftmen|拼写错 → craftsmen。真题邮件里 Paul 用的就是 craftsmen，抄题干就能对！]] will show [[good:paper-cutting and bamboo weaving|具体、加分，符合“介绍内容”要求。]] Of course, there are other activities on the playground. [[note:Let me keep a little secret for you|俏皮，但风险高。考试应用文要信息完整、表达得体；“卖关子”显得不专业，且浪费词数（只有 100 词）。建议换成实质内容。]]."},{"type":"para","id":"p3","text":"[[note:You are willing to give a hand. We are so grateful.|逻辑略松 + 时态不当。这是对 Paul 的“陈述”，像在复述他的话（第 1 段已说过一次 willing to give a hand），与题干 Please let me know what I can do 的衔接不够直接。可直接给出任务，并补一句衔接。]] [[template:Can you help prepare seats and test audio equipment?|📌 任务具体（摆座位 + 试音响），符合“请对方帮忙”要求。建议套《万能模板》8.6 书信语料 ^tmpl-letter-appreciate 的礼貌软化句式：Would you be able to assist with ___? / I would appreciate it if you could ___.]] We will gather the school hall at 2 p.m. this Friday."},{"type":"para","id":"p4","text":"[[template:Looking forward to your reply.|📌 标准结尾句式，全对。模板库 8.6 也推荐 I look forward to hearing from you.]]"},{"type":"closing","text":"[[error:Yours, sincerely|标点错：书信格式应为 Yours sincerely,（中间无逗号，末尾逗号）。]]"},{"type":"closing","text":"Li Ming"}],"summary":{"dims":[{"name":"内容要点","text":"两问（what will they show / what I can do）全部覆盖 ✅；2 点礼堂集合、4 点操场开始，安排合理，无内容矛盾"},{"name":"语言","text":"小错集中：craftmen（拼写）、demonstrate 词性、capabilities to craft-making；均为可自纠的常见错"},{"name":"语域","text":"Let me keep a little secret 偏俏皮，考试应用文宜改实质内容"},{"name":"格式","text":"有称呼 ✅；Yours sincerely, 标点需修（中间无逗号、末尾逗号）"},{"name":"结构","text":"三段式清晰，缩进式格式可用 ✅"}],"priority":["语言小错：craftmen（题干白给）、demonstrate 词性、capabilities in——熟悉即可全对","书信格式：Yours sincerely, 的标点规范","语域：俏皮表达换成实质内容（考试应用文求稳）"]},"recite":[{"wrong":"craftmen","right":"craftsmen（题干原文）"},{"wrong":"the craft demonstrate","right":"the craft demonstration / the crafts"},{"wrong":"capabilities to craft-making","right":"capabilities in craft-making"},{"wrong":"Yours, sincerely","right":"Yours sincerely,（中间无逗号、末尾逗号）"}]}</script>
<script>
const SHAPES = [
  {key:'hl_orange', ic:'●', lb:'橙·学术写作参考', cls:'mk-highlight-span', color:'#FFB86CA6'},
  {key:'hl_cyan',   ic:'●', lb:'青·日常听说读写', cls:'mk-highlight-span', color:'#ABF7F7A6'},
  {key:'hl_pink',   ic:'●', lb:'粉·完全生词',     cls:'mk-highlight-span', color:'#FFB8EBA6'},
  {key:'hl_green',  ic:'●', lb:'绿·眼熟未必准',   cls:'mk-highlight-span', color:'#BBFABBA6'},
  {key:'hl_gray',   ic:'●', lb:'灰·借鉴意义不大', cls:'mk-highlight-span', color:'#CACFD9A6'},
];
const PALETTES = {};
const DEF_COLOR={hl_orange:'#FFB86CA6',hl_cyan:'#ABF7F7A6',hl_pink:'#FFB8EBA6',hl_green:'#BBFABBA6',hl_gray:'#CACFD9A6'};
const SHAPE_COLOR={hl_orange:'#FFB86CA6',hl_cyan:'#ABF7F7A6',hl_pink:'#FFB8EBA6',hl_green:'#BBFABBA6',hl_gray:'#CACFD9A6'};

let DATA=null;
let paraMarks={};
let sid=0;
let viewing=false, draft=false;
let restoredFromLocal=false;
let activeShape=null, activeColor={};
let history=[];
let editing=null, openAnnoEl=null;
let circleBoxQueue=[];

function parsePara(text, pid){
  const marks=[]; let plain=''; let i=0;
  const re=/\[\[([a-z]+):([^|\]]+)\|([^\]]*)\]\]/g; let m;
  while((m=re.exec(text))){
    plain += text.slice(i, m.index);
    const start=plain.length; plain += m[2]; const end=plain.length;
    marks.push({id:'m'+(sid++), start, end, shape:shapeFromLegacy(m[1]), color:colorFromLegacy(m[1]), note:m[3]});
    i=re.lastIndex;
  }
  plain += text.slice(i);
  return {plain, marks};
}
function shapeFromLegacy(t){return ({error:'circle',grammar:'wave',good:'highlight',fatal:'wave',template:'box',note:'wave'})[t]||'wave';}
function colorFromLegacy(t){return ({error:'#d3232f',grammar:'#e08a00',good:'#b7f0b1',fatal:'#ff4d2e',template:'#2f6fd0',note:'#7b5cc4'})[t]||'#d3232f';}

function render(){
  const M=DATA.meta;
  pendStart=null;
  document.getElementById('pTitle').textContent=M.title;
  document.getElementById('pTitle2').textContent=M.title2||'';
  document.getElementById('pSub').textContent=M.subtitle+'　'+M.source;
  document.getElementById('pScore').innerHTML=`<b>${M.score}</b><span>${M.scoreNote}</span><div class="tap">点此看总评</div>`;
  const psEl=document.getElementById('pScore');
  psEl.classList.toggle('clickable', viewing);
  psEl.onclick=(e)=>{ if(viewing){e.stopPropagation();openSummary();} };

  const content=document.getElementById('content');
  content.innerHTML='';
  DATA.blocks.forEach((b, idx)=>{
    const pid='p'+idx;
    const parsed=parsePara(b.text, pid);
    const plain=parsed.plain, marks=[];
    if(!paraMarks[pid]) paraMarks[pid]=marks;
    const p=document.createElement('p');
    if(b.type==='salutation') p.className='salutation';
    if(b.type==='closing') p.className='closing';
    p.dataset.pid=pid;
    p.appendChild(buildParaContent(pid, plain, paraMarks[pid]));
    content.appendChild(p);
  });
  document.body.classList.toggle('viewing', viewing);
  document.body.classList.toggle('draft', draft);
  buildTools(); syncToggle(); positionToggle();
  requestAnimationFrame(()=>drawOverlays());
}
function syncToggle(){
  const icon=document.getElementById('vtIcon'), label=document.getElementById('vtLabel');
  if(viewing){icon.textContent='✏️';label.textContent='切到编辑';}
  else{icon.textContent='📖';label.textContent='切到阅读';}
}
// 把一段文本按“词/空白/标点”切成最小可点单元（英文词含 ' - ，中文整块，空白独立）
function tokenize(text){
  const tokens=[]; let i=0;
  const isWord=ch=>/[A-Za-z0-9'\u2019-]/.test(ch);
  const isCJK=ch=>/[\u4e00-\u9fa5]/.test(ch);
  const isSpace=ch=>/\s/.test(ch);
  while(i<text.length){
    let s=i, ch=text[i];
    if(isSpace(ch)){ while(i<text.length&&isSpace(text[i]))i++; }
    else if(isCJK(ch)){ while(i<text.length&&isCJK(text[i]))i++; }
    else if(isWord(ch)){ while(i<text.length&&isWord(text[i]))i++; }
    else { i++; }  // 单个标点
    tokens.push({s, e:i, text:text.slice(s,i)});
  }
  return tokens;
}
function buildParaContent(pid, plain, marks){
  const frag=document.createDocumentFragment();
  if(!marks.length){
    tokenize(plain).forEach(tk=>{
      const span=document.createElement('span'); span.className='run'; span.textContent=tk.text;
      span.dataset.pid=pid; span.dataset.start=tk.s; span.dataset.end=tk.e;
      frag.appendChild(span);
    });
    return frag;
  }
  const bounds=new Set([0,plain.length]);
  marks.forEach(mk=>{bounds.add(mk.start);bounds.add(mk.end);});
  const pts=[...bounds].sort((a,b)=>a-b);
  const spans=[];
  for(let k=0;k<pts.length-1;k++){
    const s=pts[k], e=pts[k+1]; if(s===e) continue;
    // 先把 [s,e) 按标记边界切出一段，再按词细分成子 span
    tokenize(plain.slice(s,e)).forEach(tk=>{
      const span=document.createElement('span');
      span.className='run'; span.textContent=tk.text;
      span.dataset.pid=pid; span.dataset.start=s+tk.s; span.dataset.end=s+tk.e;
      frag.appendChild(span); spans.push({s:s+tk.s, e:s+tk.e, el:span});
    });
  }
  marks.forEach(mk=>{
    const shape=mk.shape, cls=(SHAPES.find(x=>x.key===shape)||{}).cls;
    // 精读版：只有纯色高亮
    spans.filter(sp=>sp.s>=mk.start&&sp.e<=mk.end).forEach(sp=>{sp.el.classList.add('mk-hl');sp.el.style.background=mk.color;sp.el.dataset.mk=(sp.el.dataset.mk||'')+mk.id+',';});

  return frag;
}

function segmentsByOffset(p, start, end){
  const runs=[...p.querySelectorAll('.run')]; const flat=[];
  runs.forEach(r=>{
    const s=+r.dataset.start, e=+r.dataset.end;
    if(e<=start||s>=end) return;
    const a=Math.max(start,s), b=Math.min(end,e);
    flat.push(...rangeRects(r.firstChild, a-s, b-s));
  });
  const pr=p.getBoundingClientRect();
  return flat.map(r=>({x:r.left-pr.left-3,y:r.top-pr.top-4,w:r.width+6,h:r.height+9}));
}
function rangeRects(node, from, to){
  if(!node||node.nodeType!==3) return [];
  const range=document.createRange();
  range.setStart(node, Math.max(0,from)); range.setEnd(node, Math.min(node.length,to));
  return [...range.getClientRects()].map(r=>({left:r.left,top:r.top,width:r.width,height:r.height}));
}

/* 拖选用「浏览器原生 Selection」→ 映射成段落内字符偏移，不受 span 边界限制 */
let drag=null;
let suppressClick=false;
let pendStart=null;   // B(a) 首尾点选：已设的起点 {pid,s,e}

// 把 DOM (node,offset) 换算成段落内绝对字符偏移
function charOffset(p, node, offset){
  // 遍历段落内所有文本节点，累计长度，定位到 node
  const walker=document.createTreeWalker(p, NodeFilter.SHOW_TEXT, null);
  let acc=0, n;
  while((n=walker.nextNode())){
    if(n===node) return acc+offset;
    acc+=n.length;
  }
  return null;
}
// 取当前原生选区的段落内起止偏移（要求起止在同一段落内）
function selOffsets(){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed) return null;
  const r=sel.getRangeAt(0);
  let sp=r.startContainer, ep=r.endContainer;
  if(sp.nodeType!==3) sp=sp.firstChild;
  if(ep.nodeType!==3) ep=ep.firstChild;
  if(!sp||!ep) return null;
  const spEl=sp.parentElement.closest('.run'), epEl=ep.parentElement.closest('.run');
  if(!spEl||!epEl) return null;
  const p=spEl.closest('p'); if(!p||epEl.closest('p')!==p) return null; // 同段
  const pid=p.dataset.pid;
  const a=charOffset(p, sp, r.startOffset), b=charOffset(p, ep, r.endOffset);
  if(a===null||b===null) return null;
  return {pid, s:Math.min(a,b), e:Math.max(a,b)};
}

document.getElementById('content').addEventListener('mousedown', e=>{

document.addEventListener('mouseup', ev=>{
  if(!drag) return;
  const d=drag; drag=null;
  const hadSel = window.getSelection() && !window.getSelection().isCollapsed;
  if(!hadSel){ return; } // 没拖出选区 → 交给 click 处理（单点/首尾选）
  const off=selOffsets();
  if(!off||off.e<=off.s) return;
  suppressClick=true;
  clearPendStart();
  // 清掉原生选区（避免蓝色高亮残留）
  window.getSelection().removeAllRanges();
  applyRange(off.pid, off.s, off.e);

/* ===== A：触屏长按拖选 —— selectionchange 检测落定，自动激活 ===== */
let selTimer=null;
document.addEventListener('selectionchange', ()=>{
  if(viewing||draft||!activeShape) return;
  if(drag) return;                       // 桌面 mousedown 进行中，交给 mouseup
  if(document.body.classList.contains('locked')) return;
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed){ return; }
  // 选区稳定 ~450ms 后激活（触屏松手后浏览器选区保持）
  clearTimeout(selTimer);
  selTimer=setTimeout(()=>{
    if(drag) return;
    const sel2=window.getSelection();
    if(!sel2||sel2.rangeCount===0||sel2.isCollapsed) return;
    const off=selOffsets();
    if(!off||off.e<=off.s) return;
    clearPendStart();
    sel2.removeAllRanges();
    applyRange(off.pid, off.s, off.e);
  }, 450);
});

function applyRange(pid, s, e){

// 由点击坐标算出段落内字符偏移
function clickCharOffset(p, ev){
  let node=null, off=0;
  if(document.caretRangeFromPoint){
    const r=document.caretRangeFromPoint(ev.clientX, ev.clientY);
    if(r){ node=r.startContainer; off=r.startOffset; }
  } else if(document.caretPositionFromPoint){
    const cp=document.caretPositionFromPoint(ev.clientX, ev.clientY);
    if(cp){ node=cp.offsetNode; off=cp.offset; }
  }
  if(!node||node.nodeType!==3) return null;
  return charOffset(p, node, off);
}
// 把字符偏移扩展到“词”的边界（英文词含字母/数字/连字符/撇号；中文按连续汉字块）
function wordRangeAt(text, pos){
  const isWord=ch=>/[A-Za-z0-9'\u2019-]/.test(ch);
  const isCJK=ch=>/[\u4e00-\u9fa5]/.test(ch);
  let fn = isWord, i=pos;
  // 判断 pos 处的字符类型（向左优先）
  const chAt = k => (k>=0&&k<text.length)?text[k]:'';
  if(isCJK(chAt(pos)) || isCJK(chAt(pos-1))) fn = isCJK;
  let s=pos, e=pos;
  while(s>0 && fn(text[s-1])) s--;
  while(e<text.length && fn(text[e])) e++;
  if(s===e){ // 落在空格/标点上，退回单字符
    return {s:Math.max(0,pos-1), e:Math.min(text.length,pos)};
  }
  return {s, e};
}

function handleEditClick(pid, span, ev){
  let s=+span.dataset.start, e=+span.dataset.end;
  const tok=plainOf(pid).slice(s,e);
  const isBlank=/^\s*$/.test(tok);
  if(!activeShape){ hint('先在右侧选一个颜色'); return; }

  // 无起点：第一次点击设起点
  if(isBlank && !pendStart) return;
  if(!pendStart){
    pendStart={pid,s,e}; paintPend(pid,s,e);
    hint('已设起点「'+plainOf(pid).slice(s,e)+'」，再点一个词确定范围（同词再点=只标这个词）'); return;
  }
  if(pendStart.pid!==pid){
    clearPendStart(); pendStart={pid,s,e}; paintPend(pid,s,e);
    hint('已设起点「'+plainOf(pid).slice(s,e)+'」，再点一个词确定范围（同词再点=只标这个词）'); return;
  }
  // 同词再点 → 只标这一个词
  if(pendStart.s===s && pendStart.e===e){
    clearPendStart(); applyRange(pid,s,e); return;
  }
  // 不同词 → 首尾包裹成范围
  const a=Math.min(pendStart.s,s), b=Math.max(pendStart.e,e);
  clearPendStart(); applyRange(pid,a,b);
}

function undo(){
  const h=history.pop();
  if(!h){hint('没有可撤销的操作');return;}
  if(h.type==='add'){ paraMarks[h.pid]=paraMarks[h.pid].filter(x=>!h.ids.includes(x.id)); }
  else if(h.type==='delete'){ paraMarks[h.pid].push(h.snapshot); }
  else if(h.type==='modify'){ const m=paraMarks[h.pid].find(x=>x.id===h.id); if(m){m.shape=h.prev.shape;m.color=h.prev.color;m.note=h.prev.note;} }

}

  let html=`<h3>${m.title} · 总评</h3><div class="sub">得分预估 <b style="color:#c9992e">${m.score}</b>（${m.scoreNote}）</div>`;
  html+=`<div class="dimlabel">五维评价</div><table class="sumtable">`;
  s.dims.forEach(d=>html+=`<tr><td>${d.name}</td><td>${d.text}</td></tr>`);
  html+=`</table><div class="dimlabel">核心问题（按优先级）</div><ol style="font-size:12px;line-height:1.8;padding-left:18px;margin:6px 0">`;
  s.priority.forEach(p=>html+=`<li>${p}</li>`);
  html+=`</ol><div class="dimlabel">背诵清单（错处 → 正确）</div><ul class="reclist">`;
  DATA.recite.forEach(r=>html+=`<li><b>${r.wrong}</b> → <i>${r.right}</i></li>`);
  html+=`</ul><div class="row"><button class="primary" onclick="document.getElementById('sumModal').classList.remove('show')">关闭</button></div>`;
  document.getElementById('sumBox').innerHTML=html;
  document.getElementById('sumModal').classList.add('show');
}
document.getElementById('sumModal').onclick=(e)=>{ if(e.target.id==='sumModal') e.target.classList.remove('show'); };
document.getElementById('pickModal').onclick=(e)=>{ if(e.target.id==='pickModal') e.target.classList.remove('show'); };
document.getElementById('pkCancel').onclick=closePicker;

/* ==================== 工具：重绘 ==================== */
/* ==================== 存取（localStorage + 导出/导入） ==================== */
function paperKey(){ return 'wo-marks::'+(DATA&&DATA.meta&&DATA.meta.title||'default'); }
// 导出：按段落 id 分组，只存标记数据
function exportData(){
  const marks={};
  DATA.blocks.forEach((b,idx)=>{
    const pid='p'+idx;
    const arr=paraMarks[pid]||[];
    if(arr.length) marks[pid]=arr.map(m=>({start:m.start,end:m.end,shape:m.shape,color:m.color,note:m.note}));
  });
  return {
    tool:'writing-optimizer',
    version:3,
    paper:DATA.meta.title,
    savedAt:new Date().toISOString(),
    marks
  };
}
function saveLocal(){
  if(viewing) return; // 阅读视角不写本地
  try{ localStorage.setItem(paperKey(), JSON.stringify(exportData())); }catch(e){}
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(paperKey());
    if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data.marks) return false;
    applyMarksData(data.marks);
    return true;
  }catch(e){ return false; }
}
// 把导出的 marks 数据套回 paraMarks（按段落 id，重排 marks）
function applyMarksData(marks){
  Object.keys(marks).forEach(pid=>{
    if(!paraMarks[pid]) paraMarks[pid]=[];
    paraMarks[pid]=marks[pid].map(m=>({
      id:'m'+(sid++), start:m.start, end:m.end,
      shape:m.shape||'wave', color:m.color||DEF_COLOR[m.shape]||'#d3232f', note:m.note||''
    }));
  });
}
function downloadJSON(){
  const data=exportData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const safe=(DATA.meta.title||'marks').replace(/[^\w\u4e00-\u9fa5·-]+/g,'_');
  a.href=URL.createObjectURL(blob);
  a.download=safe+'.marks.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  hint('已导出标记 JSON（'+Object.values(data.marks).reduce((n,a)=>n+a.length,0)+' 条标记）');
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.marks) throw new Error('格式不对');
      history.length=0;
      Object.keys(paraMarks).forEach(pid=>paraMarks[pid]=[]);
      applyMarksData(data.marks);
      rerenderAndDraw();
      hint('已导入 '+(Object.values(data.marks).reduce((n,a)=>n+a.length,0))+' 条标记');
    }catch(e){ hint('导入失败：'+e.message); }
  };
  r.readAsText(file);
}
function clearLocal(){
  if(!confirm('确定清空本地暂存的标记？（页面将恢复到线上版本）')) return;
  try{ localStorage.removeItem(paperKey()); }catch(e){}
  location.reload();
}

function rerenderAndDraw(){ render(); saveLocal(); }
var _t=null;
function hint(msg){ const h=document.getElementById('hint'); h.textContent=msg; h.classList.add('show'); clearTimeout(_t); _t=setTimeout(()=>h.classList.remove('show'),1900); }

/* ==================== 视角切换 ==================== */
document.getElementById('viewToggle').onclick=()=>{
  viewing=!viewing; if(viewing){activeShape=null;hideAnno();}
  render(); hint(viewing?'已进入阅读视角（受众）':'已进入编辑视角（批注者）');
};
window.addEventListener('resize', ()=>{requestAnimationFrame(drawOverlays);positionToggle();});
// 底部居中按钮：编辑态避开右侧工具栏（62px），阅读态整宽居中
function positionToggle(){
  const viewingNow=document.body.classList.contains('viewing');
  const shift=viewingNow?'0px':'-31px'; // 工具栏半宽
  document.documentElement.style.setProperty('--vt-shift', shift);
}

/* ==================== 启动 ==================== */
const EMBED=true;
const QS=new URLSearchParams(location.search);
function boot(j){
  DATA=j;
  if(QS.get('mode')==='view'){ viewing=true; document.body.classList.add('locked'); }
  render();
  // 读取本地暂存的标记（编辑与阅读视角都生效）
  restoredFromLocal=loadLocal();
  if(restoredFromLocal){ rerender_afterLoad(); }
  if(!viewing){
    if(restoredFromLocal) hint('已恢复本地暂存的标记（未上线）');
    else hint('选工具→点词标记；点已标记处可改');
  }
}
function rerender_afterLoad(){ render(); buildTools(); }
document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(f) importJSON(f);
  e.target.value='';
});
if(EMBED){ boot(JSON.parse(document.getElementById('app-data').textContent)); }
else{ fetch('data/2025-english1-essayA.json').then(r=>r.json()).then(boot).catch(err=>{document.getElementById('content').innerHTML='<p style="color:#c33">数据加载失败：'+err+'</p>';}); }

</script>
