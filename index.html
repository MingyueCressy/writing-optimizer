<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作文批阅工作台</title>
<style>
  :root{
    --paper:#f6f0e2; --paper-line:#e3d9c4; --ink:#2b2721; --ink-soft:#6b6459;
    --tool-bg:#262b33; --tool-bg2:#1c2027; --tool-line:#3a424e; --accent:#c9992e;
    --font-serif: Georgia, "Times New Roman", "Songti SC", serif;
    --font-note: "Source Han Sans SC","思源黑体","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);font-family:var(--font-note);color:var(--ink)}
  #app{display:flex;height:100vh;height:100dvh;overflow:hidden}

  #stage{flex:1;display:flex;flex-direction:column;padding:0;overflow:auto;position:relative}
  #viewToggle{position:fixed;bottom:18px;left:50%;transform:translateX(calc(-50% + var(--vt-shift,0px)));z-index:60;
    display:flex;align-items:center;gap:6px;background:rgba(28,32,39,.92);
    border:1px solid #3a424e;border-radius:20px;padding:6px 12px 6px 10px;
    color:#e7d9b4;font-size:12px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);
    transition:.15s;user-select:none}
  #viewToggle:hover{background:#3c4653;transform:translateX(calc(-50% + var(--vt-shift,0px))) translateY(-1px)}
  #viewToggle .vic{font-size:15px;line-height:1}

  #paperWrap{display:flex;flex-direction:column;align-items:stretch;width:100%;flex:1;min-height:100%}
  #paper{
    position:relative;width:100%;max-width:100%;
    background:linear-gradient(180deg,#f8f3e7 0%,var(--paper) 100%);
    border-radius:0;box-shadow:none;
    padding:46px 40px 48px;overflow:visible;flex:1;
  }
  #paper::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:0;
    background-image:radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
    background-size:3px 3px;mix-blend-mode:multiply;opacity:.5}
  #paperHead{position:relative;z-index:2;border-bottom:1.5px solid var(--paper-line);padding-bottom:12px;margin-bottom:18px}
  #headRow1{display:flex;align-items:center;gap:14px}
  #headA{flex:1 1 auto;min-width:0;text-align:center}
  #pTitle{font-family:var(--font-serif);font-size:19px;font-weight:700;color:#241f18;line-height:1.3;white-space:nowrap}
  #pTitle2{font-family:var(--font-serif);font-size:19px;font-weight:700;color:#241f18;line-height:1.3;white-space:nowrap}
  #headB{flex:0 0 auto;width:112px;text-align:center}
  #pScore{cursor:default}
  #pScore.clickable{cursor:pointer}
  #pScore.clickable:hover b{text-decoration:underline}
  #pScore b{font-family:var(--font-serif);font-size:23px;color:var(--accent);display:block;line-height:1.05}
  #pScore span{font-size:10px;color:var(--ink-soft);display:block;margin-top:4px;line-height:1.35}
  #pScore .tap{display:none;font-size:9px;color:#a5641c;margin-top:3px}
  body.viewing #pScore .tap{display:block}
  #headRow2{margin-top:10px;padding-top:9px;border-top:1px dashed var(--paper-line)}
  #pSub{font-size:11.5px;color:var(--ink-soft);letter-spacing:.2px}
  .wcBadge{display:inline-block;margin-left:8px;font-size:11px;color:#7a5a1e;background:linear-gradient(180deg,#fdf6e6,#f6ead0);border:1px solid #ddc99a;border-radius:20px;padding:1px 9px;letter-spacing:.3px}
  .wcBadge b{font-family:var(--font-serif);font-size:12.5px;color:#a5641c}

  #content{position:relative;z-index:2;font-family:var(--font-serif);font-size:17.5px;line-height:2.15;color:var(--ink)}
  #content p{margin:0 0 16px;position:relative}
  #content p.salutation{margin-bottom:12px}
  #content p.closing{margin:0 0 4px}
  .run{position:relative;cursor:pointer;border-radius:2px}
  body:not(.viewing) .run:hover{background:rgba(201,153,46,.16)}
  .run.hit-flash{background:rgba(201,153,46,.30);box-shadow:0 0 0 1.5px #c9992e;border-radius:3px}
  .pend-ov{position:absolute;pointer-events:none;background:rgba(201,153,46,.30);box-shadow:0 0 0 1.5px #c9992e;border-radius:3px;z-index:3}

  .mk-wave{text-decoration:underline wavy;text-decoration-thickness:1.7px;text-underline-offset:5px}
  .mk-underline{text-decoration:underline;text-decoration-thickness:1.7px;text-underline-offset:5px}
  .mk-double{text-decoration:underline double;text-decoration-thickness:3px;text-underline-offset:5px}
  .mk-strike{text-decoration:line-through;text-decoration-thickness:1.7px}
  .ins-sign{display:inline-block;font-size:22px;font-weight:700;line-height:1;vertical-align:super;transform:translateY(-2px);margin:0 -2px;cursor:pointer;font-family:Georgia,serif;
    min-width:2ch;text-align:center;padding:0 4px;box-sizing:content-box}

  .overlay{position:absolute;z-index:1;pointer-events:none}

  .anno{position:absolute;z-index:40;width:75vw;max-width:75vw;
    background:#fffdf6;border:1px solid #e0d6bd;border-left:4px solid #999;border-radius:6px;
    padding:9px 12px;font-size:15.5px;line-height:1.7;color:#332e26;
    box-shadow:0 8px 26px rgba(0,0,0,.28);pointer-events:auto;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
    max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .anno.show{opacity:1;transform:none}
  .anno .cite{font-family:var(--font-serif);font-style:italic;color:#a5641c;display:block;margin-bottom:4px;font-size:14.5px}

  #tools{flex:0 0 68px;background:linear-gradient(180deg,var(--tool-bg) 0%,var(--tool-bg2) 100%);
    border-left:1px solid #0c0f13;display:flex;flex-direction:column;align-items:center;
    padding:12px 6px;gap:7px;overflow-y:auto}
  .tool{width:56px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:#313845;border:1px solid var(--tool-line);border-radius:8px;padding:4px 2px;
    color:#cfd6e0;cursor:pointer;transition:.13s;user-select:none;position:relative}
  .tool:hover{background:#3c4653;transform:translateY(-1px)}
  .tool.active{background:var(--accent);border-color:#e8bd57;color:#1c1508;box-shadow:0 0 0 2px rgba(201,153,46,.35)}
  .tool .ic{font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
  .tool .tlbl{font-size:9.5px;line-height:1;color:#b9c2cf;white-space:nowrap;letter-spacing:.2px;margin-top:1px}
  .tool.active .tlbl{color:#1c1508;font-weight:600}
  .tool .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #ffffff66}
  .tsep{width:34px;height:1px;background:var(--tool-line);margin:4px 0}
  .tool.mini{height:36px}
  .tool.mini .ic{font-size:16px}

  #swatch{position:fixed;z-index:120;display:none;background:#2b323d;border:1px solid #4a5464;
    border-radius:10px;padding:9px 10px;box-shadow:0 10px 34px rgba(0,0,0,.6)}
  #swatch.show{display:block}
  #swatch .swTitle{color:#cfd6e0;font-size:10.5px;letter-spacing:.5px;margin-bottom:7px}
  #swatch .swRow{display:flex;gap:8px}
  .swatch-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #ffffff33;transition:.12s}
  .swatch-dot:hover{transform:scale(1.14);border-color:#fff}
  .swatch-dot.on{border-color:#fff;box-shadow:0 0 0 2px #fff8}

  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    background:rgba(28,32,39,.94);color:#e7d9b4;font-size:12px;padding:7px 14px;border-radius:20px;
    border:1px solid #3a424e;pointer-events:none;opacity:0;transition:opacity .2s;z-index:199}
  #hint.show{opacity:1}

  .modal{position:fixed;inset:0;background:rgba(8,10,13,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:#fbf7ec;border-radius:8px;width:min(560px,94vw);max-height:86vh;overflow:auto;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 4px;font-family:var(--font-serif);font-size:17px;color:#241f18}
  .modal .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:14px}
  .modal .mrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .mbtn{border:1px solid #d6cbaf;background:#f2ead6;border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;color:#3a342a;display:flex;align-items:center;gap:5px}
  .mbtn:hover{background:#eae0c8}
  .mbtn.on{background:var(--accent);border-color:#b8882a;color:#1c1508;font-weight:700}
  .modal label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 4px}
  .modal textarea{width:100%;min-height:74px;border:1px solid #ddd2b8;border-radius:5px;padding:8px;font-size:13px;line-height:1.6;resize:vertical;background:#fffdf7;color:#2b2721;font-family:var(--font-note)}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .modal button{border:1px solid #d6cbaf;background:#f2ead6;border-radius:5px;padding:8px 16px;font-size:12.5px;cursor:pointer}
  .modal button.primary{background:var(--accent);border-color:#b8882a;color:#1c1508;font-weight:600}
  .modal button.danger{background:#f6ded9;border-color:#d9a79c;color:#a5362a}
  .modal .quote{font-family:var(--font-serif);font-style:italic;background:#f3ecdb;border-radius:4px;padding:6px 9px;font-size:12.5px;color:#5a5142;margin-top:4px}
  .palette{display:flex;gap:7px;flex-wrap:wrap}
  .pdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid #00000022}
  .pdot.on{border-color:#8a6d1f;box-shadow:0 0 0 2px #c9992e88}
  .sumtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  .sumtable td{border:1px solid #e3d9c4;padding:6px 8px;vertical-align:top}
  .sumtable td:first-child{width:74px;color:var(--ink-soft);background:#f3ecdb;font-weight:600}
  .reclist{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
  .reclist li{padding:5px 0;border-bottom:1px dashed #e3d9c4}
  .reclist b{color:#c31f2b;font-family:var(--font-serif)}
  .reclist i{color:#2e7d46;font-style:normal}
  .dimlabel{font-size:11px;letter-spacing:1px;color:#a5641c;margin:14px 0 2px;font-weight:700}
  .sedit{border:1px solid #e3d9c4;border-radius:4px;background:#fffdf7;color:#2b2721;font-family:inherit;resize:vertical;outline:none}
  .sedit:focus{border-color:#c9992e;box-shadow:0 0 0 2px #c9992e33}
  .dimgroup{margin:6px 0 10px;padding:6px 8px;border:1px dashed #e3d9c4;border-radius:5px;background:#fbf7ee}
  .dimgroup input{margin-bottom:4px}

  .pklist{display:flex;flex-direction:column;gap:7px;margin:8px 0 0}
  .pkitem{display:flex;align-items:center;gap:9px;border:1px solid #ddd2b8;background:#fffdf7;
    border-radius:7px;padding:9px 11px;cursor:pointer;transition:.13s}
  .pkitem:hover{background:#f6efdc;border-color:#c9992e}
  .pkitem.pknew{border-style:dashed;color:#8a6d1f}
  .pkitem .pksw{font-size:17px;width:20px;text-align:center;font-weight:700}
  .pkitem .pklb{flex:1;font-size:12.5px;color:#332e26}
  .pkitem .pklb i{display:block;font-family:var(--font-serif);color:#7d7364;font-size:11px;font-style:italic;margin-top:1px}
  .pkitem .pknote{font-size:10.5px;color:#a5641c;white-space:nowrap}

  @media (max-width:560px){
    #tools{flex-basis:56px;padding:10px 5px}
    .tool{width:40px;height:38px}
    #paper{padding:30px 22px 34px}
    #content{font-size:15px;line-height:2.0}
  }
  body.viewing #tools{display:none}
  body.viewing #viewToggle{color:#bfe3c4}
  body.locked #viewToggle{display:none}
  #modelBar{margin-top:26px;text-align:center;border-top:1px dashed #d9cfb8;padding-top:18px}
  #btnModel{font-family:var(--font-serif);font-size:14px;color:#7a5a1e;background:linear-gradient(180deg,#fdf6e6,#f6ead0);border:1px solid #ddc99a;border-radius:8px;padding:8px 18px;cursor:pointer;letter-spacing:1px;transition:.15s}
  #btnModel:hover{background:linear-gradient(180deg,#fdf0d5,#f2e2bf)}
  #btnArchive{font-family:var(--font-serif);font-size:14px;color:#4a5a7a;background:linear-gradient(180deg,#eef2fa,#dde6f5);border:1px solid #b9c8e2;border-radius:8px;padding:8px 18px;margin-left:10px;cursor:pointer;letter-spacing:1px;transition:.15s}
  #btnArchive:hover{background:linear-gradient(180deg,#e8eefa,#d3dff0)}
  /* 往期作文弹窗 */
  #archList{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .archItem{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border:1px solid #e0d5bd;border-radius:10px;background:linear-gradient(180deg,#fffdf7,#faf5ea);cursor:pointer;transition:.15s;font-family:var(--font-serif)}
  .archItem:hover{border-color:#c9a86a;background:linear-gradient(180deg,#fff7e6,#f6ecd6);transform:translateY(-1px)}
  .archItem .aTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .archItem .aName{font-size:15px;color:#3a3128;font-weight:600}
  .archItem .aScore{font-size:13px;color:#a5641c;white-space:nowrap}
  .archItem .aMeta{font-size:12.5px;color:#8a7c5c;letter-spacing:.5px}
  #btnReload{font-family:var(--font-serif);font-size:13px;color:#6d7a5a;background:linear-gradient(180deg,#f4f8ee,#e8f0dd);border:1px solid #c9dab2;border-radius:8px;padding:8px 14px;margin-left:10px;cursor:pointer;letter-spacing:1px;transition:.15s}
  #btnReload:hover{background:linear-gradient(180deg,#eff6e6,#e0ebd0)}
  #modelWrap{display:none;margin-top:16px;font-size:15.5px;line-height:2.0;color:#2b2721}
  #modelWrap.show{display:block}
  #modelWrap .modelTitle{font-family:var(--font-serif);font-size:13px;color:#a5641c;letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #eadfc6;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
  #modelWrap .modelBody p{margin:0 0 12px;text-indent:2em}
  #modelWrap .modelBody p.salutation,#modelWrap .modelBody p.closing{text-indent:0}
  #modelWrap .modelNote{margin-top:14px;font-size:12.5px;color:#8a7c5c;line-height:1.8;background:#faf6ec;border-left:3px solid #e0d3ae;padding:10px 14px;border-radius:4px}

  /* 题目（真题原文）：答卷头部（含标题/得分/信息行）下方、正文上方的查看按钮 + 展开面板 */
  #qBar{text-align:center;margin:2px 0 16px}
  #btnQuestion{font-family:var(--font-serif);font-size:13px;color:#8a3b1e;background:linear-gradient(180deg,#fdeee6,#f7dfd2);border:1px solid #e0b8a4;border-radius:8px;padding:7px 16px;cursor:pointer;letter-spacing:1px;transition:.15s}
  #btnQuestion:hover{background:linear-gradient(180deg,#fde6d9,#f3d3c1)}
  #questionWrap{display:none;margin:0 0 18px;font-size:14.5px;line-height:1.95;color:#3a3128;
    background:#fbf6ea;border:1px solid #e6d9bd;border-left:4px solid #c9992e;border-radius:6px;padding:14px 18px}
  #questionWrap.show{display:block}
  #questionWrap .qTitle{font-family:var(--font-serif);font-size:12.5px;color:#a5641c;letter-spacing:2px;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid #eadfc6}
  #questionWrap .qDir{font-family:var(--font-serif);color:#5a5142}
  #questionWrap .qDir p{margin:0 0 8px}
  #questionWrap .qDir ol{margin:6px 0 8px;padding-left:22px}
  #questionWrap .qDir .qquote{background:#f3ecdb;border-left:3px solid #ddc99a;padding:8px 12px;border-radius:4px;font-style:italic;color:#5a5142;margin:8px 0}
  #questionWrap .qtable{margin:10px 0 12px;overflow-x:auto}
  #questionWrap table{border-collapse:collapse;font-family:"Times New Roman",Georgia,serif;font-size:14px;margin:0 auto;background:#fffdf7}
  #questionWrap table caption{caption-side:top;font-size:12.5px;color:#8a7c5c;text-align:left;padding:0 0 6px}
  #questionWrap table th,#questionWrap table td{border:1px solid #d8cbad;padding:5px 14px;text-align:center;white-space:nowrap}
  #questionWrap table thead th{background:#f0e6cf;color:#6b5a34;font-weight:600}
  #questionWrap table tbody td:first-child{background:#faf5e9;color:#7a6a48;font-weight:600}
  #questionWrap .qnote{margin-top:10px;font-size:12.5px;color:#8a7c5c;line-height:1.8}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="paperWrap">
      <div id="paper">
        <div id="paperHead">
          <div id="headRow1">
            <div id="headA">
              <div id="pTitle">加载中…</div>
              <div id="pTitle2"></div>
            </div>
            <div id="headB">
              <div id="pScore"></div>
            </div>
          </div>
          <div id="headRow2">
            <div id="pSub"></div>
          </div>
        </div>
        <div id="qBar">
          <button id="btnQuestion" type="button">📑 查看题目</button>
        </div>
        <div id="questionWrap"></div>
        <div id="content"></div>
        <div id="modelWrap"></div>
        <div id="modelBar">
          <button id="btnModel" type="button">📖 查看范文</button>
          <button id="btnArchive" type="button">📚 往期作文</button>
          <button id="btnReload" type="button" title="清除本地暂存，加载最新批注">🔄 加载最新版</button>
        </div>
      </div>
    </div>
    <div id="viewToggle" title="切换编辑 / 阅读视角">
      <span class="vic" id="vtIcon">✏️</span><span id="vtLabel">切到阅读</span>
    </div>  </div>
  <div id="tools"></div>
</div>

<div id="hint"></div>
<div id="swatch"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<div class="modal" id="editModal">
  <div class="box">
    <h3 id="emTitle">编辑标记</h3>
    <div class="sub" id="emCite"></div>
    <div class="quote" id="emQuote"></div>
    <label>形态</label>
    <div class="mrow" id="emShapes"></div>
    <label>颜色</label>
    <div class="palette" id="emColors"></div>
    <label>批注意见</label>
    <textarea id="emText" placeholder="输入批注意见（可留空）…"></textarea>
    <div class="row">
      <button class="danger" id="emDelete">删除标记</button>
      <button id="emCancel">取消</button>
      <button class="primary" id="emOk">确定</button>
    </div>
  </div>
</div>

<div class="modal" id="sumModal">
  <div class="box" id="sumBox"></div>
</div>

<div class="modal" id="archModal">
  <div class="box" style="width:min(520px,94vw)">
    <h3>📚 往期作文</h3>
    <div class="sub">点选一篇，在新标签页打开（只读阅读版）</div>
    <div id="archList"></div>
    <div class="row"><button id="archClose">关闭</button></div>
  </div>
</div>

<div class="modal" id="textEditModal">
  <div class="box" id="teBox"></div>
</div>

<div class="modal" id="pickModal">
  <div class="box" style="width:min(420px,94vw)">
    <h3>这里有重叠的标记</h3>
    <div class="sub" id="pkCite"></div>
    <div class="pklist" id="pkList"></div>
    <div class="row"><button id="pkCancel">取消</button></div>
  </div>
</div>

function renderQuestion(){
  const wrap=document.getElementById('questionWrap');
  const bar=document.getElementById('qBar');
  const q=DATA.question;
  if(!q || (!q.dir && !q.quote)){ bar.style.display='none'; wrap.innerHTML=''; return; }
  bar.style.display='';
  wrap.innerHTML='';
  if(q.title){ const t=document.createElement('div'); t.className='qTitle'; t.textContent=q.title; wrap.appendChild(t); }
  const dir=document.createElement('div'); dir.className='qDir';
  (q.dir||[]).forEach(seg=>{
    if(typeof seg==='string'){ const p=document.createElement('p'); p.textContent=seg; dir.appendChild(p); }
    else if(seg && seg.ol){
      const ol=document.createElement('ol'); seg.ol.forEach(x=>{const li=document.createElement('li');li.textContent=x;ol.appendChild(li);});
      dir.appendChild(ol);
    } else if(seg && seg.table){
      const box=document.createElement('div'); box.className='qtable';
      const tb=document.createElement('table');
      if(seg.caption){ const c=document.createElement('caption'); c.textContent=seg.caption; tb.appendChild(c); }
      if(seg.head){ const thead=document.createElement('thead'); const tr=document.createElement('tr');
        seg.head.forEach(h=>{const th=document.createElement('th'); th.textContent=h; tr.appendChild(th);}); thead.appendChild(tr); tb.appendChild(thead); }
      if(seg.rows){ const tbody=document.createElement('tbody');
        seg.rows.forEach(r=>{const tr=document.createElement('tr'); r.forEach(c=>{const td=document.createElement('td'); td.textContent=c; tr.appendChild(td);}); tbody.appendChild(tr);});
        tb.appendChild(tbody); }
      box.appendChild(tb); dir.appendChild(box);
    }
  });
  if(q.quote){ const qq=document.createElement('div'); qq.className='qquote'; qq.textContent=q.quote; dir.appendChild(qq); }
  wrap.appendChild(dir);
  if(q.note){ const n=document.createElement('div'); n.className='qnote'; n.textContent=q.note; wrap.appendChild(n); }
}

// 范文层：DATA.model = {title, blocks:[{type,text}], note}
function countWords(text){
  // 英文作文词数：去掉破折号/连接符后按空白分词；含省略号的词算 1 个
  if(!text) return 0;
  const t=String(text).replace(/[—–]/g,' ').trim();
  if(!t) return 0;
  const en=t.split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w));
  // 中文按字计（如有中文字符，逐字补计）
  const zh=(t.match(/[\u4e00-\u9fa5]/g)||[]).length;
  return en.length+zh;
}

// 把一段文本按“词/空白/标点”切成最小可点单元（英文词含 ' - ，中文整块，空白独立）
function tokenize(text){
  const tokens=[]; let i=0;
  const isWord=ch=>/[A-Za-z0-9'\u2019-]/.test(ch);
  const isCJK=ch=>/[\u4e00-\u9fa5]/.test(ch);
  const isSpace=ch=>/\s/.test(ch);
  while(i<text.length){
    let s=i, ch=text[i];
    if(isSpace(ch)){ while(i<text.length&&isSpace(text[i]))i++; }
    else if(isCJK(ch)){ while(i<text.length&&isCJK(text[i]))i++; }
    else if(isWord(ch)){ while(i<text.length&&isWord(text[i]))i++; }
    else { i++; }  // 单个标点
    tokens.push({s, e:i, text:text.slice(s,i)});
  }
  return tokens;
}
function buildParaContent(pid, plain, marks){
  const frag=document.createDocumentFragment();
  if(!marks.length){frag.appendChild(document.createTextNode(plain));return frag;}
  const insMarks=marks.filter(m=>m.shape==='insert');
  const regMarks=marks.filter(m=>m.shape!=='insert');
  const bounds=new Set([0,plain.length]);
  regMarks.forEach(mk=>{bounds.add(mk.start);bounds.add(mk.end);});
  const pts=[...bounds].sort((a,b)=>a-b);
  const spans=[];
  const posEls={};  // 偏移 -> 插入点标记元素（用于把 ∇ 放到正确位置）
  for(let k=0;k<pts.length-1;k++){
    const s=pts[k], e=pts[k+1]; if(s===e) continue;
    // 先把 [s,e) 按标记边界切出一段，再按词细分成子 span
    tokenize(plain.slice(s,e)).forEach(tk=>{
      const span=document.createElement('span');
      span.className='run'; span.textContent=tk.text;
      span.dataset.pid=pid; span.dataset.start=s+tk.s; span.dataset.end=s+tk.e;
      frag.appendChild(span); spans.push({s:s+tk.s, e:s+tk.e, el:span});
    });
  }
  regMarks.forEach(mk=>{
    const shape=mk.shape, cls=(SHAPES.find(x=>x.key===shape)||{}).cls;
    if(shape==='circle'){}
    else if(shape==='highlight'){
      spans.filter(sp=>sp.s>=mk.start&&sp.e<=mk.end).forEach(sp=>{sp.el.classList.add('mk-highlight-span');sp.el.style.background=hexA(mk.color,.55);sp.el.dataset.mk=(sp.el.dataset.mk||'')+mk.id+',';});
    } else {
      spans.filter(sp=>sp.s>=mk.start&&sp.e<=mk.end).forEach(sp=>{sp.el.classList.add(cls);sp.el.style.textDecorationColor=mk.color;sp.el.dataset.mk=(sp.el.dataset.mk||'')+mk.id+',';});
    }
  });
  // 插入型标记（∇ 补充）：在指定偏移处插一个红色倒 V 符号
  insMarks.forEach(mk=>{
    const sign=document.createElement('span');
    sign.className='ins-sign'; sign.textContent='∇';
    sign.dataset.ins='1'; sign.dataset.mk=mk.id;
    sign.style.color=mk.color||'#d3232f';
    sign.title=mk.note||'此处需补充信息';
    posEls[mk.start]=sign;
  });
  // 把插入符号按偏移放到 span 序列里（找不到精确位置就落到最近的前一个 span 之后）
  if(insMarks.length){
    const sorted=Object.keys(posEls).map(Number).sort((a,b)=>a-b);
    sorted.forEach(pos=>{
      const sign=posEls[pos];
      const after=[...spans].reverse().find(sp=>sp.e<=pos) || null;
      if(after && after.el.parentNode) after.el.parentNode.insertBefore(sign, after.el.nextSibling);
      else frag.insertBefore(sign, frag.firstChild);
    });
  }
  circleBoxQueue=circleBoxQueue.concat(marks.filter(m=>m.shape==='circle').map(m=>({pid,m})));
  return frag;
}
function drawOverlays(){
  document.querySelectorAll('#content .overlay').forEach(o=>o.remove());
  document.querySelectorAll('#content p').forEach(p=>{
    const pid=p.dataset.pid;
    (paraMarks[pid]||[]).forEach(m=>{
      if(m.shape!=='circle') return;
      const rects=segmentsByOffset(p, m.start, m.end);
      if(!rects.length) return;
      // 圆圈：合并所有碎片为一个大包围盒（整段圈一次，而非每词一个）
      const minX=Math.min(...rects.map(r=>r.x)), minY=Math.min(...rects.map(r=>r.y));
      const maxX=Math.max(...rects.map(r=>r.x+r.w)), maxY=Math.max(...rects.map(r=>r.y+r.h));
      const bb={x:minX, y:minY, w:maxX-minX, h:maxY-minY};
      const ov=document.createElement('div'); ov.className='overlay';
      ov.style.left=bb.x+'px'; ov.style.top=bb.y+'px'; ov.style.width=bb.w+'px'; ov.style.height=bb.h+'px';
      ov.innerHTML=`<svg width="${bb.w}" height="${bb.h}" style="overflow:visible"><path fill="none" stroke="${m.color}" stroke-width="2.2" stroke-linecap="round" d="${ellipsePath(bb.w,bb.h)}"/></svg>`;
      p.appendChild(ov);
    });
  });
}
function segmentsByOffset(p, start, end){
  const runs=[...p.querySelectorAll('.run')]; const flat=[];
  runs.forEach(r=>{
    const s=+r.dataset.start, e=+r.dataset.end;
    if(e<=start||s>=end) return;
    const a=Math.max(start,s), b=Math.min(end,e);
    flat.push(...rangeRects(r.firstChild, a-s, b-s));
  });
  const pr=p.getBoundingClientRect();
  return flat.map(r=>({x:r.left-pr.left-3,y:r.top-pr.top-4,w:r.width+6,h:r.height+9}));
}
function rangeRects(node, from, to){
  if(!node||node.nodeType!==3) return [];
  const range=document.createRange();
  range.setStart(node, Math.max(0,from)); range.setEnd(node, Math.min(node.length,to));
  return [...range.getClientRects()].map(r=>({left:r.left,top:r.top,width:r.width,height:r.height}));
}
function ellipsePath(w,h){
  const cx=w/2,cy=h/2,rx=w/2-1,ry=h/2-1;
  return `M ${cx-rx} ${cy} A ${rx} ${ry} 0 1 0 ${cx+rx} ${cy} A ${rx} ${ry} 0 1 0 ${cx-rx} ${cy} Z`;
}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

/* 拖选用「浏览器原生 Selection」→ 映射成段落内字符偏移，不受 span 边界限制 */
let drag=null;
let suppressClick=false;
let pendStart=null;   // B(a) 首尾点选：已设的起点 {pid,s,e}

// 把 DOM (node,offset) 换算成段落内绝对字符偏移
function charOffset(p, node, offset){
  // 遍历段落内所有文本节点，累计长度，定位到 node
  const walker=document.createTreeWalker(p, NodeFilter.SHOW_TEXT, null);
  let acc=0, n;
  while((n=walker.nextNode())){
    if(n===node) return acc+offset;
    acc+=n.length;
  }
  return null;
}
// 取当前原生选区的段落内起止偏移（要求起止在同一段落内）
function selOffsets(){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed) return null;
  const r=sel.getRangeAt(0);
  let sp=r.startContainer, ep=r.endContainer;
  if(sp.nodeType!==3) sp=sp.firstChild;
  if(ep.nodeType!==3) ep=ep.firstChild;
  if(!sp||!ep) return null;
  const spEl=sp.parentElement.closest('.run'), epEl=ep.parentElement.closest('.run');
  if(!spEl||!epEl) return null;
  const p=spEl.closest('p'); if(!p||epEl.closest('p')!==p) return null; // 同段
  const pid=p.dataset.pid;
  const a=charOffset(p, sp, r.startOffset), b=charOffset(p, ep, r.endOffset);
  if(a===null||b===null) return null;
  return {pid, s:Math.min(a,b), e:Math.max(a,b)};
}

document.getElementById('content').addEventListener('mousedown', e=>{
  if(viewing) return;
  const span=e.target.closest('.run');
  if(!span||!activeShape) return;

});
document.addEventListener('mouseup', ev=>{
  if(!drag) return;
  const d=drag; drag=null;
  const hadSel = window.getSelection() && !window.getSelection().isCollapsed;
  if(!hadSel){ return; } // 没拖出选区 → 交给 click 处理（单点/首尾选）
  const off=selOffsets();
  if(!off||off.e<=off.s) return;
  suppressClick=true;
  clearPendStart();
  // 清掉原生选区（避免蓝色高亮残留）
  window.getSelection().removeAllRanges();
  applyRange(off.pid, off.s, off.e);
});

/* ===== A：触屏长按拖选 —— selectionchange 检测落定，自动激活 ===== */
let selTimer=null;
document.addEventListener('selectionchange', ()=>{
  if(viewing||!activeShape) return;
  if(drag) return;                       // 桌面 mousedown 进行中，交给 mouseup
  if(document.body.classList.contains('locked')) return;
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed){ return; }
  // 选区稳定 ~450ms 后激活（触屏松手后浏览器选区保持）
  clearTimeout(selTimer);
  selTimer=setTimeout(()=>{
    if(drag) return;
    const sel2=window.getSelection();
    if(!sel2||sel2.rangeCount===0||sel2.isCollapsed) return;
    const off=selOffsets();
    if(!off||off.e<=off.s) return;
    clearPendStart();
    sel2.removeAllRanges();
    applyRange(off.pid, off.s, off.e);
  }, 450);
});

function applyRange(pid, s, e){
  if(!paraMarks[pid]) paraMarks[pid]=[];
  const mk={id:'m'+(sid++), start:s, end:e, shape:activeShape, color:activeColor[activeShape]||DEF_COLOR[activeShape], note:''};
  paraMarks[pid].push(mk);
  history.push({type:'add', pid, ids:[mk.id]});
  rerenderAndDraw();
  openEditor(pid, mk, true);
}
// B(a)：清起点
function clearPendStart(){

document.getElementById('content').addEventListener('click', e=>{

function handleEditClick(pid, span, ev){
  let s=+span.dataset.start, e=+span.dataset.end;
  const tok=plainOf(pid).slice(s,e);
  // 点到空白/标点 token：先看它是否落在某个标记范围内 → 是则查该标记
  // 否则忽略（无工具时）；有工具时以该位置为准
  const isBlank=/^\s*$/.test(tok);
  const hits=findMarks(pid, s, e);

  // ===== 补充信息（∇）：点标点/词，在该 token 末尾插入一个零长度标记 =====
  if(activeShape==='insert'){
    const pos=e; // 插在点击 token 之后（即标点后）
    const exist=(paraMarks[pid]||[]).some(m=>m.shape==='insert' && m.start===pos);
    if(exist){ hint('这里已经有一个补充标记了'); return; }
    const mk={id:'m'+(sid++), start:pos, end:pos, shape:'insert', color:activeColor['insert']||DEF_COLOR['insert'], note:''};
    history.push({type:'add', pid, ids:[mk.id]});
    if(!paraMarks[pid]) paraMarks[pid]=[];
    paraMarks[pid].push(mk);
    rerenderAndDraw();
    openEditor(pid, mk, true);
    return;
  }

  // ===== B(a) 首尾点选：有工具在手时，两次点击定一个范围 =====
  if(activeShape){
    if(isBlank && !pendStart) return;   // 空白不能作为起点
    if(!pendStart){
      pendStart={pid, s, e};
      paintPend(pid, s, e);
      hint('已设起点「'+plainOf(pid).slice(s,e)+'」，再点另一个词=范围，同词再点=只标这个词');
      return;
    }
    if(pendStart.pid!==pid){
      clearPendStart(); pendStart={pid, s, e}; paintPend(pid, s, e);
      hint('已设起点「'+plainOf(pid).slice(s,e)+'」，再点另一个词=范围，同词再点=只标这个词');
      return;
    }
    if(pendStart.s===s && pendStart.e===e){
      // 同词再点 = 直接标这一个词（单念标记），而不是取消
      clearPendStart();
      return applyRange(pid, s, e);
    }
    const a=Math.min(pendStart.s, s), b=Math.max(pendStart.e, e);
    clearPendStart();
    return applyRange(pid, a, b);
  }

  // ===== 无工具在手：点已标记处 → 编辑器/拾取器；无标记 → 轻提示 =====
  if(hits.length===0){
    if(isBlank) return;
    hint('「'+tok+'」这里没有标记（要加标记请先在右侧选工具）');
    return;
  }
  if(hits.length===1){ openEditor(pid, hits[0]); return; }
  openPicker(pid, s, e, hits);
}

// 用绝对定位的高亮块标出“起点词”（只亮这个词，不亮整个 run）
function paintPend(pid, s, e){
  const p=document.querySelector(`p[data-pid="${pid}"]`);
  if(!p) return;
  segmentsByOffset(p, s, e).forEach(rect=>{
    const ov=document.createElement('div'); ov.className='pend-ov';
    ov.style.left=rect.x+'px'; ov.style.top=rect.y+'px'; ov.style.width=rect.w+'px'; ov.style.height=rect.h+'px';
    p.appendChild(ov);
  });
}
function createMark(pid, s, e){
  const shape=activeShape, color=activeColor[shape]||DEF_COLOR[shape];
  const newMk={id:'m'+(sid++), start:s, end:e, shape, color, note:''};
  paraMarks[pid].push(newMk);
  history.push({type:'add', pid, ids:[newMk.id]});
  rerenderAndDraw();
  openEditor(pid, newMk, true);
}
// 返回所有“覆盖”该范围（词落在标记内）的标记，内层（范围小）优先
function findMarks(pid, s, e){
  return (paraMarks[pid]||[]).filter(m=>s>=m.start && e<=m.end)
    .sort((a,b)=>(a.end-a.start)-(b.end-b.start));
}

function handleViewClick(pid, span){

  const s=+span.dataset.start, e=+span.dataset.end;
  const hits=findMarks(pid, s, e);
  // 优先显示有批注的（最内层优先）
  const mk=hits.find(m=>m.note) || hits[0];
  if(!mk){ hint('这里没有批注'); return; }
  // 高亮整条标记的范围（点词 → 选中它所属的完整标记）
  flashMark(pid, mk);
  if(!mk.note){ hint('这条标记没有批注（已高亮所属范围）'); return; }
  showAnno(pid, mk);
}
// 临时高亮某条标记覆盖的所有词（阅读态点词时用）
function flashMark(pid, mk){
  document.querySelectorAll('.run.hit-flash').forEach(r=>r.classList.remove('hit-flash'));
  const p=document.querySelector(`p[data-pid="${pid}"]`);
  if(!p) return;
  [...p.querySelectorAll('.run')].forEach(r=>{
    const a=+r.dataset.start, b=+r.dataset.end;
    if(a>=mk.start && b<=mk.end) r.classList.add('hit-flash');
  });
}
function clearFlash(){ document.querySelectorAll('.run.hit-flash').forEach(r=>r.classList.remove('hit-flash')); }
function showAnno(pid, mk){
  const text=plainOf(pid).slice(mk.start, mk.end);   // 整条标记的文本，而非单个词
  const card=document.createElement('div'); card.className='anno show'; card.dataset.mk=mk.id;
  card.innerHTML=`<span class="cite">${text}</span>${mk.note}`;
  document.getElementById('paper').appendChild(card);
  const pr=document.getElementById('paper').getBoundingClientRect();
  // 锚点：标记范围的第一个词
  const p=document.querySelector(`p[data-pid="${pid}"]`);
  let anchor=null;
  if(p){ anchor=[...p.querySelectorAll('.run')].find(r=>{const a=+r.dataset.start;return a>=mk.start && a<mk.end;}); }
  const er=(anchor||p||document.getElementById('paper')).getBoundingClientRect();
  let left=er.right-pr.left+10, top=er.top-pr.top-4;
  const cw=card.offsetWidth, ch=card.offsetHeight;
  if(left+cw>pr.width) left=Math.max(6, er.left-pr.left-cw-6);
  if(top<4) top=4;
  if(top+ch>pr.height-6) top=Math.max(4, pr.height-ch-6);
  card.style.left=left+'px'; card.style.top=top+'px';
  openAnnoEl=card;
}
function hideAnno(){ if(openAnnoEl){openAnnoEl.remove();openAnnoEl=null;} clearFlash(); }
document.getElementById('stage').addEventListener('click', e=>{
  if(e.target.closest('.run')||e.target.closest('.anno')||e.target.closest('#viewToggle')||e.target.closest('.tool')||e.target.closest('#swatch')||e.target.closest('#pScore')||e.target.closest('#qBar')||e.target.closest('#questionWrap')||e.target.closest('#modelBar')) return;
  hideAnno();
});
// 滚动时隐藏批语气泡：但若滚动发生在气泡内部（移动端查看长批语），不隐藏
const _stageEl=document.getElementById('stage');
function _onStageScroll(e){ if(e && e.target && e.target.closest && e.target.closest('.anno')) return; hideAnno(); }
_stageEl.addEventListener('scroll', _onStageScroll, true);
// 移动端：手指在气泡上滑动/触摸时不隐藏气泡

document.addEventListener('touchmove', e=>{ if(e.target && e.target.closest && e.target.closest('.anno')) e.stopPropagation(); }, {passive:true});

/* ==================== 标记编辑弹层 ==================== */
function openEditor(pid, mk, isNew){
  editing={pid, id:mk.id, orig:{...mk}, isNew};
  const m=paraMarks[pid].find(x=>x.id===mk.id);
  const text=plainOf(pid).slice(m.start, m.end);
  document.getElementById('emTitle').textContent = isNew?'新建标记':'编辑标记';
  document.getElementById('emCite').textContent = text ? `「${text}」` : '（此位置补充信息 ∇）';
  document.getElementById('emText').value = m.note||'';
  renderShapeBtns(m.shape);
  renderColorDots(m.shape, m.color);
  document.getElementById('editModal').classList.add('show');
}
function plainOf(pid){ const p=document.querySelector(`p[data-pid="${pid}"]`); return [...p.querySelectorAll('.run')].map(r=>r.textContent).join(''); }
function renderShapeBtns(cur){
  document.getElementById('emShapes').innerHTML=SHAPES.map(s=>`<div class="mbtn${s.key===cur?' on':''}" data-shape="${s.key}"><span>${s.ic}</span>${s.lb}</div>`).join('');
  document.querySelectorAll('#emShapes .mbtn').forEach(b=>{
    b.onclick=()=>{ const sh=b.dataset.shape; renderShapeBtns(sh); renderColorDots(sh, PALETTES[sh][0]); editing._shape=sh; editing._color=PALETTES[sh][0]; };
  });
  editing._shape=cur;
}
function renderColorDots(shape, cur){
  document.getElementById('emColors').innerHTML=PALETTES[shape].map(c=>`<div class="pdot${c===cur?' on':''}" data-c="${c}" style="background:${c}"></div>`).join('');
  document.querySelectorAll('#emColors .pdot').forEach(d=>{
    d.onclick=()=>{ renderColorDots(shape, d.dataset.c); editing._color=d.dataset.c; };
  });
  editing._color=cur;
}
document.getElementById('emOk').onclick=()=>{
  const {pid, id, orig}=editing;
  const m=paraMarks[pid].find(x=>x.id===id);
  if(!editing.isNew) history.push({type:'modify', pid, id, prev:{...orig}});
  m.shape=editing._shape; m.color=editing._color; m.note=document.getElementById('emText').value.trim();
  closeEditor(); rerenderAndDraw();
  hint('已保存');
};
document.getElementById('emCancel').onclick=()=>{
  if(editing&&editing.isNew){
    const {pid,id}=editing;
    paraMarks[pid]=paraMarks[pid].filter(x=>x.id!==id);
  }
  closeEditor(); rerenderAndDraw();
};
document.getElementById('emDelete').onclick=()=>{
  const {pid,id}=editing;
  const m=paraMarks[pid].find(x=>x.id===id);
  history.push({type:'delete', pid, snapshot:{...m}});
  paraMarks[pid]=paraMarks[pid].filter(x=>x.id!==id);
  closeEditor(); rerenderAndDraw(); hint('已删除标记');
};
function closeEditor(){ document.getElementById('editModal').classList.remove('show'); editing=null; }

/* ==================== 撤销 ==================== */
function undo(){
  const h=history.pop();
  if(!h){hint('没有可撤销的操作');return;}
  if(h.type==='add'){ paraMarks[h.pid]=paraMarks[h.pid].filter(x=>!h.ids.includes(x.id)); }
  else if(h.type==='delete'){ paraMarks[h.pid].push(h.snapshot); }
  else if(h.type==='modify'){ const m=paraMarks[h.pid].find(x=>x.id===h.id); if(m){m.shape=h.prev.shape;m.color=h.prev.color;m.note=h.prev.note;} }
  rerenderAndDraw(); hint('已撤销');
}

/* ==================== 总评 ==================== */
function openSummary(){

function renderSummaryEdit(){
  const s=DATA.summary, m=DATA.meta;
  let html=`<h3>${m.title} · 总评（可编辑）</h3>`;
  html+=`<div class="dimlabel">得分预估</div>`;

  html+=`<div class="dimlabel">总评意见</div>`;

  s.dims.forEach((d,i)=>{
    html+=`<div class="dimgroup"><input class="sedit sedim-name" data-i="${i}" value="${(d.name||'').replace(/"/g,'&quot;')}" style="width:100%;box-sizing:border-box;font-size:12px;font-weight:700;padding:4px 6px">
    <textarea class="sedit sedim-text" data-i="${i}" rows="2" style="width:100%;box-sizing:border-box;font-size:12px;padding:4px 6px">${d.text||''}</textarea></div>`;
  });
  html+=`</div>`;

  html+=`<div class="dimlabel">核心问题（按优先级，一行一条）</div>`;
  html+=`<textarea class="sedit" id="sePriority" rows="4" style="width:100%;box-sizing:border-box;font-size:12px;padding:6px 8px">${(s.priority||[]).join('\n')}</textarea>`;

  html+=`<div class="dimlabel">背诵清单（错处 → 正确，一行一条，用 “→” 分隔）</div>`;
  html+=`<textarea class="sedit" id="seRecite" rows="4" style="width:100%;box-sizing:border-box;font-size:12px;padding:6px 8px">${(DATA.recite||[]).map(r=>r.wrong+' → '+r.right).join('\n')}</textarea>`;

  html+=`<div class="row"><button id="seCancel">取消</button><button class="primary" id="seSave">保存</button></div>`;
  document.getElementById('sumBox').innerHTML=html;
  document.getElementById('sumModal').classList.add('show');

  document.getElementById('seCancel').onclick=()=>document.getElementById('sumModal').classList.remove('show');
  document.getElementById('seSave').onclick=saveSummaryEdit;
}
function saveSummaryEdit(){
  DATA.meta.score=document.getElementById('seScore').value.trim();
  DATA.meta.scoreNote=document.getElementById('seNote').value.trim();
  // dims
  document.querySelectorAll('#seDims .sedim-name').forEach(inp=>{
    const i=+inp.dataset.i; DATA.summary.dims[i].name=inp.value.trim();
  });
  document.querySelectorAll('#seDims .sedim-text').forEach(ta=>{
    const i=+ta.dataset.i; DATA.summary.dims[i].text=ta.value.trim();
  });
  // priority（一行一条，去空行）
  DATA.summary.priority=document.getElementById('sePriority').value.split('\n').map(x=>x.trim()).filter(Boolean);
  // recite（一行一条，按 → 拆）
  DATA.recite=document.getElementById('seRecite').value.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{
    const parts=line.split(/\s*→\s*/);
    return {wrong:(parts[0]||'').trim(), right:(parts.slice(1).join(' → ')||'').trim()};
  });
  document.getElementById('sumModal').classList.remove('show');
  rerenderAndDraw();
  hint('已保存总评（记得导出 JSON 与我更新）');
}

/* ==================== 编辑原文（修转录错误） ==================== */
function openTextEdit(){
  let html=`<h3>编辑原文</h3><div class="sub">修改转录错误；保存后自动平移标记位置，请复核</div>`;
  DATA.blocks.forEach((b,idx)=>{
    const pid='p'+idx;
    const plain=parsePara(b.text, pid).plain;
    html+=`<div class="dimlabel">第 ${idx+1} 段（${b.type}）</div>`;
    html+=`<textarea class="sedit tebox" data-i="${idx}" rows="3" style="width:100%;box-sizing:border-box;font-size:13px;padding:6px 8px">${plain}</textarea>`;
  });
  html+=`<div class="row"><button id="teCancel">取消</button><button class="primary" id="teSave">保存原文</button></div>`;
  document.getElementById('teBox').innerHTML=html;
  document.getElementById('textEditModal').classList.add('show');
  document.getElementById('teCancel').onclick=()=>document.getElementById('textEditModal').classList.remove('show');
  document.getElementById('teSave').onclick=saveTextEdit;
}
// 公共前缀长度
function commonPrefix(a,b){ let i=0; const n=Math.min(a.length,b.length); while(i<n && a[i]===b[i]) i++; return i; }
// 公共后缀长度（不与前缀重叠）
function commonSuffix(a,b,pfx){ let i=0; const n=Math.min(a.length,b.length)-pfx; while(i<n && a[a.length-1-i]===b[b.length-1-i]) i++; return i; }
function saveTextEdit(){
  let moved=0, needCheck=0;
  document.querySelectorAll('#teBox .tebox').forEach(ta=>{
    const idx=+ta.dataset.i;
    const pid='p'+idx;
    const oldPlain=parsePara(DATA.blocks[idx].text, pid).plain;
    const newPlain=ta.value;
    if(oldPlain===newPlain) return;
    const pfx=commonPrefix(oldPlain,newPlain);
    const sfx=commonSuffix(oldPlain,newPlain,pfx);
    const delta=newPlain.length-oldPlain.length;
    const tailStart=oldPlain.length-sfx;  // 改动点 = [pfx, tailStart) 区间被替换
    const arr=paraMarks[pid]||[];
    arr.forEach(m=>{
      if(m.end<=pfx){ /* 改动点之前：不动 */ }
      else if(m.start>=tailStart){ m.start+=delta; m.end+=delta; moved++; }
      else { needCheck++; } // 跨改动点：保留原位，提示复核
    });
    DATA.blocks[idx].text=newPlain;
  });
  document.getElementById('textEditModal').classList.remove('show');
  rerenderAndDraw();
  let msg='已保存原文';
  if(moved) msg+=`，平移 ${moved} 个标记`;
  if(needCheck) msg+=`；⚠️ ${needCheck} 个标记跨改动点，请复核`;
  hint(msg);
}
document.getElementById('textEditModal').onclick=(e)=>{ if(e.target.id==='textEditModal') e.target.classList.remove('show'); };
document.getElementById('sumModal').onclick=(e)=>{ if(e.target.id==='sumModal') e.target.classList.remove('show'); };
document.getElementById('pickModal').onclick=(e)=>{ if(e.target.id==='pickModal') e.target.classList.remove('show'); };

/* ==================== 工具：重绘 ==================== */
/* ==================== 存取（localStorage + 导出/导入） ==================== */
function paperKey(){ return 'wo-marks::'+(DATA&&DATA.meta&&DATA.meta.title||'default'); }
// 导出：按段落 id 分组，只存标记数据
function exportData(){
  const marks={};
  DATA.blocks.forEach((b,idx)=>{
    const pid='p'+idx;
    const arr=paraMarks[pid]||[];
    if(arr.length) marks[pid]=arr.map(m=>({start:m.start,end:m.end,shape:m.shape,color:m.color,note:m.note}));
  });
  return {
    tool:'writing-optimizer',
    version:4,
    paper:DATA.meta.title,
    savedAt:new Date().toISOString(),
    meta:{score:DATA.meta.score, scoreNote:DATA.meta.scoreNote},
    summary:{dims:DATA.summary.dims, priority:DATA.summary.priority},
    recite:DATA.recite,
    blocks:DATA.blocks.map((b,idx)=>({type:b.type, id:'p'+idx, text:parsePara(b.text,'p'+idx).plain})),
    marks,
    ...(DATA.rev!==undefined?{rev:DATA.rev}:{}),
    ...(DATA.model?{model:DATA.model}:{})
  };
}
function saveLocal(){
  if(viewing) return; // 阅读视角不写本地
  try{ localStorage.setItem(paperKey(), JSON.stringify(exportData())); }catch(e){}
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(paperKey());
    if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data.marks) return false;
    // 版本守卫：若线上 app-data 带了 rev，且本地 rev 不一致 → 丢弃旧本地缓存
    if(DATA.rev!==undefined && data.rev!==undefined && String(data.rev)!==String(DATA.rev)){
      localStorage.removeItem(paperKey());
      return false;
    }
    applyMarksData(data.marks);
    applySummaryData(data);
    return true;
  }catch(e){ return false; }
}
// 把导出的总评数据套回 DATA（meta/summary/recite）
function applySummaryData(data){
  if(data.meta){
    if(data.meta.score!==undefined) DATA.meta.score=data.meta.score;
    if(data.meta.scoreNote!==undefined) DATA.meta.scoreNote=data.meta.scoreNote;
  }
  if(data.summary){
    if(data.summary.dims) DATA.summary.dims=data.summary.dims;
    if(data.summary.priority) DATA.summary.priority=data.summary.priority;
  }
  if(data.recite) DATA.recite=data.recite;
  if(data.blocks) data.blocks.forEach((b,i)=>{ if(DATA.blocks[i]) DATA.blocks[i].text=b.text; });
  if(data.model) DATA.model=data.model;
}
// 把导出的 marks 数据套回 paraMarks（按段落 id，重排 marks）
function applyMarksData(marks){
  Object.keys(marks).forEach(pid=>{
    if(!paraMarks[pid]) paraMarks[pid]=[];
    paraMarks[pid]=marks[pid].map(m=>({
      id:'m'+(sid++), start:m.start, end:m.end,
      shape:m.shape||'wave', color:m.color||DEF_COLOR[m.shape]||'#d3232f', note:m.note||''
    }));
  });
}
function downloadJSON(){
  const data=exportData();
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  const safe=(DATA.meta.title||'marks').replace(/[^\w\u4e00-\u9fa5·-]+/g,'_');
  a.href=URL.createObjectURL(blob);
  a.download=safe+'.marks.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  hint('已导出标记 JSON（'+Object.values(data.marks).reduce((n,a)=>n+a.length,0)+' 条标记）');
  // 兜底：某些内置浏览器/App 会拦截下载 → 同时给一个 Base64 复制框（纯 ASCII，复制不乱码）
  showExportFallback(safe, json);
}
function showExportFallback(safe, json){
  const b64=btoa(unescape(encodeURIComponent(json)));
  let html=`<h3>导出 JSON</h3>`;
  html+=`<div class="sub">已尝试下载 <b>${safe}.marks.json</b>。若你的浏览器/App 没有真的下载文件，请复制下方 Base64（纯英文数字，复制不会乱码）发给酸奶学姐即可。</div>`;
  html+=`<div class="dimlabel">① 原始 JSON（可直接另存为 .json 文件）</div>`;
  html+=`<textarea class="sedit" rows="4" readonly style="width:100%;box-sizing:border-box;font-size:11px;padding:6px 8px">${json.replace(/</g,'&lt;')}</textarea>`;
  html+=`<div class="dimlabel">② Base64 兜底（复制这一段，最稳）</div>`;
  html+=`<textarea class="sedit" id="teB64" rows="4" readonly style="width:100%;box-sizing:border-box;font-size:11px;padding:6px 8px">${b64}</textarea>`;
  html+=`<div class="row"><button id="teCopyB64" class="primary">复制 Base64</button><button id="teClose">关闭</button></div>`;
  document.getElementById('teBox').innerHTML=html;
  document.getElementById('textEditModal').classList.add('show');
  document.getElementById('teClose').onclick=()=>document.getElementById('textEditModal').classList.remove('show');
  document.getElementById('teCopyB64').onclick=()=>{
    const ta=document.getElementById('teB64'); ta.select(); ta.setSelectionRange(0,ta.value.length);
    try{ document.execCommand('copy'); hint('已复制 Base64，粘贴发我即可'); }
    catch(e){ hint('复制失败，请手动全选复制'); }
  };
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.marks) throw new Error('格式不对');
      history.length=0;
      Object.keys(paraMarks).forEach(pid=>paraMarks[pid]=[]);
      applyMarksData(data.marks);
      applySummaryData(data);
      rerenderAndDraw();
      hint('已导入 '+(Object.values(data.marks).reduce((n,a)=>n+a.length,0))+' 条标记'+(data.summary?'（含总评）':''));
    }catch(e){ hint('导入失败：'+e.message); }
  };
  r.readAsText(file);
}
function clearLocal(){
  if(!confirm('确定清空本地暂存的标记？（页面将恢复到线上版本）')) return;
  try{ localStorage.removeItem(paperKey()); }catch(e){}
  location.reload();
}

function rerenderAndDraw(){ render(); saveLocal(); }
var _t=null;
function hint(msg){ const h=document.getElementById('hint'); h.textContent=msg; h.classList.add('show'); clearTimeout(_t); _t=setTimeout(()=>h.classList.remove('show'),1900); }

/* ==================== 启动 ==================== */
const QS=new URLSearchParams(location.search);
function boot(j){
  DATA=j;
  if(QS.get('mode')==='view'){ viewing=true; document.body.classList.add('locked'); }
  render();
  // 读取本地暂存的标记（编辑与阅读视角都生效）

    else hint('选工具→点词标记；点已标记处可改');
  }
}

document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(f) importJSON(f);
  e.target.value='';
});
boot(JSON.parse(document.getElementById('app-data').textContent));
